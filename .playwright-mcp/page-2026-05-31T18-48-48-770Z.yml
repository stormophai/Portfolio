        - paragraph [ref=e499]: FAQ
        - heading "Check Out the Answers to Common Questions" [level=2] [ref=e501]
      - generic [ref=e502]:
        - generic [ref=e503] [cursor=pointer]:
          - heading "How fast can we launch?" [level=3] [ref=e505]
          - paragraph [ref=e509]: "Most teams are running live campaigns within 24-48 hours. Day one: connect your CRM (GoHighLevel integration is fastest, or we'll set you up with a pre-configured account), choose a campaign template, and customize your blueprint. Day two: test calls, refine your script, and go live. No 90-day implementations. No dev team required."
        - generic [ref=e510] [cursor=pointer]:
          - heading "Won't AI calling just create more work for my team?" [level=3] [ref=e512]
          - paragraph [ref=e516]: Only if it's built wrong. Most AI platforms dump transcripts, require manual review, and add steps to your workflow. Voxr AI qualifies and routes automatically—your reps only take calls from prospects who are actually ready to talk. No babysitting robots. No cleaning up AI mistakes. Just qualified conversations landing on their calendar or transferring live. Plus, our supervisor and agent access levels let you delegate monitoring and management without micromanaging every call.
        - generic [ref=e517] [cursor=pointer]:
          - heading "How do live transfers actually work?" [level=3] [ref=e519]
          - paragraph [ref=e523]: When a prospect is qualified and ready to talk, Voxr AI identifies the best-fit rep based on your routing rules (skills, territory, product line, availability—you decide). The call transfers seamlessly with full context visible to your rep before they even say hello—prospect's name, what they're interested in, any concerns raised, qualification status. No awkward handoff. No "let me pull up your account." Your rep jumps straight into closing mode. If no reps are available? The AI books an appointment on the appropriate calendar. If the calendar is full? The AI schedules itself a callback at an optimal time to try again. Nothing falls through.
        - generic [ref=e524] [cursor=pointer]:
          - heading "Do prospects actually want to talk to AI?" [level=3] [ref=e526]
          - paragraph [ref=e530]: "Here's what matters: prospects want fast answers and quick next steps. They don't want to wait 4 hours for a callback or leave three voicemails. Voxr AI engages them within 60 seconds with natural-sounding conversation that makes most people comfortable—they're often surprised they're not talking to a human. The AI answers their questions, confirms what they need, and either connects them to the right person immediately or books a confirmed time to talk. Most prospects are too focused on getting their problem solved to even ask. And for those who do? We're fully transparent and compliant with disclosure requirements."
        - generic [ref=e531] [cursor=pointer]:
          - heading "Can it handle our call volume?" [level=3] [ref=e533]
          - paragraph [ref=e537]: Voxr AI scales infinitely. Whether you're working 100 leads or 10,000, the platform handles volume without degradation. Our smart DID management auto-provisions numbers as you grow, maintains caller ID reputation at scale, and ensures connect rates stay high even during massive campaigns.
        - generic [ref=e538] [cursor=pointer]:
          - heading "How do you prevent numbers from getting spam-flagged?" [level=3] [ref=e540]
          - paragraph [ref=e544]: Automatically. Voxr AI monitors your DID pool in real-time, purchases local presence numbers for each region you're calling, rotates volume strategically to avoid carrier flags, and retires compromised numbers before they tank your connect rates. You never think about telephony infrastructure—it just works.
        - generic [ref=e545] [cursor=pointer]:
          - heading "What about compliance (TCPA, DNC, etc.)?" [level=3] [ref=e547]
          - paragraph [ref=e551]: Voxr AI supports opt-out requests, honors DNC lists, and logs consent appropriately. You're responsible for ensuring your lead sources are compliant, but our platform gives you the tools to operate within regulations—call time restrictions, automatic opt-outs, full call recordings, and audit trails.
        - generic [ref=e552] [cursor=pointer]:
          - heading "We've tried other AI calling platforms. Why is Voxr different?" [level=3] [ref=e554]
          - paragraph [ref=e558]: Most platforms are built for inbound answering and treat outbound as an afterthought. Voxr AI is purpose-built for outbound sales—native campaign management, intelligent cadences, live transfer routing, and DID management that actually works at scale. Our customers have tried 8-10 other platforms. This is the one that delivers.
        - generic [ref=e559] [cursor=pointer]:
          - heading "What happens if a prospect wants to talk to a human immediately?" [level=3] [ref=e561]
          - paragraph [ref=e565]: That's exactly what Voxr AI is designed for. The moment a prospect says "I want to speak with someone" or shows clear buying intent, the AI transfers them to an available rep instantly—or books an appointment if no one's free. We're not trying to close deals with robots. We're getting qualified humans to qualified humans, fast.
        - generic [ref=e566] [cursor=pointer]:
          - heading "Can we use this for both inbound AND outbound?" [level=3] [ref=e568]
          - paragraph [ref=e572]: Absolutely. While Voxr AI is purpose-built for outbound (campaign management, cadences, persistence), those same capabilities make us exceptional at inbound qualification and routing. Same smart qualification. Same seamless live transfers. Same infrastructure. Whether leads are calling you or you're calling them, the experience is identical.
        - generic [ref=e573] [cursor=pointer]:
          - heading "What if we need to customize for our specific industry or use case?" [level=3] [ref=e575]
          - paragraph [ref=e579]: Every campaign is fully customizable—blueprints (scripts), qualification logic, routing rules, cadence timing, and follow-up sequences. Start with our templates, then dial it in for your exact process. Insurance, solar, real estate, B2B SaaS, lead generation—we support them all. And our team helps you optimize during onboarding.
